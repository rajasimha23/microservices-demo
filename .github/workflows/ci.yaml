name: CI Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Push images to ECR and Scan
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          for i in adservice; do
            SRC="./src/${i}"
            DEST="$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"
            docker build -t $DEST $SRC
            docker push $DEST
          done

  update_helm_chart:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: update helm chart with new image tag
        run: |
          sed -i 's/tag:.*/tag: ${{github.ref_name}}-${{github.sha}}/' helm-chart/values-${{github.ref_name}}.yaml
          cat helm-chart/values-${{github.ref_name}}.yaml | grep -A 1 -B 1 -i image


      - name: commit and push changes
        run: |
          git config --global user.name 'rajasimha23'
          git config --global user.email 'githubactions@gmail.com'
          git add .
          git commit -am "updated image tag to ${{github.ref_name}}-${{github.sha}}"
          git push origin ${{github.ref_name}}

  notify_failure:
    runs-on: ubuntu-latest
    needs: [build, update_helm_chart]
    if: failure()
    steps:
      - name: Send failure notification
        run: echo "Build, update, or deployment verification failed. Notification sent."
  
